name: tentar-servidor
on:
  schedule: [{cron: "*/30 * * * *"}]
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  tentar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install oci
      - name: Config da Oracle
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "${{ secrets.OCI_KEY }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=sa-saopaulo-1\nkey_file=%s\n' \
            "${{ secrets.OCI_USER }}" "${{ secrets.OCI_FINGERPRINT }}" "${{ secrets.OCI_TENANCY }}" "$HOME/.oci/key.pem" > ~/.oci/config
      - name: Tentar criar
        env:
          SSH_PUB: ${{ secrets.SSH_PUB }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python criar_servidor.py; rc=$?
          if [ $rc -eq 0 ]; then gh workflow disable tentar-servidor --repo ${{ github.repository }}; exit 0; fi
          if [ $rc -eq 10 ]; then exit 0; fi
          exit $rc
